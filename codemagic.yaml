workflows:
  upload_ipa_to_appstore:
    name: 上传已有IPA到App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "eric"
    scripts:
      - name: 下载IPA
        script: wget https://te-st.top/app.ipa -O app.ipa
      - name: 上传IPA到ASC（带回执日志）
        script: app-store-connect publish --path app.ipa --asc-integration eric
